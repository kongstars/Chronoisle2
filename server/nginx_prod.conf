# 四时清单 - Nginx 生产环境配置
# 该文件由 deploy_prod.js 自动推送到服务器并生效。

# ---- 全局限流区域定义（放在 http 块，但此处用于 server 块内引用）----
# 注意：limit_req_zone 指令需要放在 nginx.conf 的 http {} 块中，
# 部署时请将以下两行添加到 /etc/nginx/nginx.conf 的 http {} 块内：
#   limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
#   limit_req_zone $binary_remote_addr zone=api_ai:10m rate=5r/m;

# 强制将所有 HTTP 请求重定向到 HTTPS
server {
    listen 80;
    server_name sishiqingdan.cn www.sishiqingdan.cn api.sishiqingdan.cn;
    return 301 https://$host$request_uri;
}

# HTTPS 服务配置
server {
    listen 443 ssl http2;
    server_name sishiqingdan.cn www.sishiqingdan.cn api.sishiqingdan.cn;

    # 请确保你在阿里云申请下载的证书放置于 server/cert 目录中，伴随着项目一起传至此路径
    ssl_certificate /opt/chronoisle-server/cert/sishiqingdan.cn.pem;
    ssl_certificate_key /opt/chronoisle-server/cert/sishiqingdan.cn.key;
    
    ssl_session_timeout 5m;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 反爬与基础安全Header
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    # 请求体大小限制（防止超大 payload 攻击）
    client_max_body_size 5m;

    # AI 相关接口：严格限流（每分钟5次）
    location ~ ^/api/(agent|plan|goal-planning)/ {
        limit_req zone=api_ai burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # AI 接口允许更长超时
        proxy_connect_timeout 60s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # 通用 API 转发到 PM2 的正式服端口 (3000)
    location / {
        limit_req zone=api_general burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持 (视应用逻辑选择)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 延长处理超时时间，防止语音解析等长耗时请求异常中断
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
