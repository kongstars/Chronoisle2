# 四时清单 - 测试环境 Nginx 配置
# 用于 test-api.sishiqingdan.cn -> 114.55.135.35:3000 的 HTTPS 反向代理。

server {
    listen 80;
    server_name test-api.sishiqingdan.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name test-api.sishiqingdan.cn;

    ssl_certificate /opt/chronoisle-server/cert/test-api.sishiqingdan.cn.pem;
    ssl_certificate_key /opt/chronoisle-server/cert/test-api.sishiqingdan.cn.key;

    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # AI 目标规划遇到复杂目标时可能跨多个模型调用，保留足够网关等待时间。
        proxy_connect_timeout 60s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
