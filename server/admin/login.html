<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>四时清单 · 管理后台登录</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">CI</div>
      <h1 class="login-title">四时清单</h1>
      <p class="login-subtitle">管理后台</p>
      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="username">管理员账号</label>
          <input type="text" id="username" placeholder="请输入账号" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" placeholder="请输入密码" required autocomplete="current-password">
        </div>
        <div id="loginError" class="form-error" style="display:none;"></div>
        <button type="submit" class="btn-primary btn-full" id="loginBtn">登 录</button>
      </form>
    </div>
    <p class="login-footer">(c) 2026 四时清单 Team · Chronoisle Admin</p>
  </div>
  <script>
    const API_BASE = window.location.origin;
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('loginError');
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = '登录中...';
      try {
        const res = await fetch(API_BASE + '/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('admin_token', data.token);
          window.location.href = 'index.html';
        } else {
          errEl.textContent = data.message || '登录失败';
          errEl.style.display = 'block';
        }
      } catch (err) {
        errEl.textContent = '网络错误，请检查服务器连接';
        errEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = '登 录';
      }
    });
  </script>
</body>
</html>
