<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronoisle - 今日页 (终极无界版)</title>
    <style>
        :root {
            /* 极简色板 */
            --bg-color: #F5F6F8; /* 稍微深一点的背景，为了衬托无界列表 */
            --surface-color: #FFFFFF;
            --surface-pressed: #EAECEF; 
            --text-primary: #111218;
            --text-secondary: #5A5D6B;
            --text-muted: #9497A6;
            
            --primary-color: #5C5EE6; /* 稍微沉稳一点的紫色 */
            --primary-light: rgba(92, 94, 230, 0.08);
            --success-color: #00B84F;
            --danger-color: #F03A30;
            
            --ai-gradient: linear-gradient(135deg, #5C5EE6, #00C6FF);
            
            --border-light: rgba(0, 0, 0, 0.05);
            
            /* 极小圆角，更显专业/科技 */
            --radius-lg: 12px;
            --radius-md: 10px;
            --radius-sm: 6px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            background-color: #E0E2E6; color: var(--text-primary);
            display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;
        }

        .device {
            width: 390px; height: 844px;
            background: var(--bg-color);
            background-image: radial-gradient(var(--border-light) 1px, transparent 1px);
            background-size: 20px 20px; background-position: center top;
            border-radius: 40px; box-shadow: 0 24px 48px rgba(0, 0, 0, 0.1);
            overflow: hidden; position: relative; display: flex; flex-direction: column;
            border: 8px solid #FFFFFF;
        }

        /* 极简透明顶栏，无硬边框 */
        .header {
            position: absolute; top: 0; left: 0; right: 0;
            padding: 44px 16px 8px;
            background: linear-gradient(to bottom, rgba(245,246,248,0.95) 60%, rgba(245,246,248,0));
            display: flex; justify-content: space-between; align-items: flex-end; z-index: 10;
        }
        .header-left { display: flex; flex-direction: column; gap: 2px; }
        .header-title { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
        .header-date { font-size: 11px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        .header-icon { width: 28px; height: 28px; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; }

        /* 内容区 */
        .content { flex: 1; overflow-y: auto; padding: 90px 16px 80px; display: flex; flex-direction: column; gap: 20px; }
        .content::-webkit-scrollbar { display: none; }

        .section-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; padding-left: 2px; }
        .section-title { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        /* AI 推荐卡 (极简卡片) */
        .hero-card {
            background: var(--surface-color); border-radius: var(--radius-lg); padding: 14px 16px;
            position: relative; overflow: hidden;
            transition: transform 0.1s;
        }
        .hero-card:active { transform: scale(0.98); background: var(--surface-pressed); }
        .hero-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; bottom: 0; background: var(--ai-gradient); }
        .hero-label { font-size: 11px; font-weight: 600; color: var(--primary-color); display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
        .hero-title { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
        .hero-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.4; }

        /* 无界列表 (Borderless List) */
        .list-group {
            display: flex; flex-direction: column; gap: 8px; /* 完全抛弃外层容器，使用 gap 分隔独立行 */
        }
        
        .list-row {
            background: var(--surface-color); border-radius: var(--radius-md);
            padding: 12px 14px; display: flex; align-items: flex-start; gap: 10px;
            transition: transform 0.1s, background 0.1s;
            /* 只保留极弱的内部阴影或完全扁平 */
        }
        .list-row:active { transform: scale(0.98); background: var(--surface-pressed); }
        
        .checkbox { width: 18px; height: 18px; border-radius: 4px; /* 效率软件常用圆角矩形复选框，比圆形更显专业 */ border: 1.5px solid var(--text-muted); flex-shrink: 0; margin-top: 2px; transition: 0.1s; }
        .checkbox:active { transform: scale(0.9); border-color: var(--primary-color); background: var(--primary-light); }
        
        .row-content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
        
        .row-title { font-size: 14px; font-weight: 500; line-height: 1.3; color: var(--text-primary); }
        
        /* 极限降噪的 Meta 区域 */
        .row-meta-area { display: flex; gap: 10px; align-items: center; font-size: 11px; color: var(--text-muted); }
        .meta-item { display: flex; align-items: center; gap: 4px; }
        .meta-item svg { width: 12px; height: 12px; opacity: 0.7; }
        .meta-item.danger { color: var(--danger-color); }
        .meta-item.danger svg { opacity: 1; }

        /* 极简底栏 */
        .tabbar {
            position: absolute; bottom: 0; left: 0; right: 0; height: 60px;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; justify-content: space-between; padding: 0 20px 10px; z-index: 10;
        }
        .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); transition: 0.1s; }
        .tab-item.active { color: var(--text-primary); }
        .tab-item svg { width: 22px; height: 22px; }
        .tab-item:active { transform: scale(0.9); }
        
        /* 极致轻薄的悬浮 AI 按钮 */
        .ai-fab-container { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 20; }
        .ai-fab {
            width: 44px; height: 44px; border-radius: 16px; /* 采用更具科技感的圆角矩形(Squircle) */
            background: var(--text-primary); /* 黑底白标，对比度极高，极其干练 */
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15); position: relative; transition: transform 0.1s;
        }
        .ai-fab:active { transform: scale(0.92); }
        .ai-fab svg { width: 20px; height: 20px; color: #FFFFFF; }
        
        /* 如果需要暗示 AI 属性，只在按钮内保留极小面积的渐变 */
        .ai-fab-dot { position: absolute; top: 8px; right: 8px; width: 4px; height: 4px; border-radius: 50%; background: var(--ai-gradient); }

    </style>
</head>
<body>
    <div class="device">
        <!-- 极简顶栏 -->
        <header class="header">
            <div class="header-left">
                <div class="header-date">10 OCT, THU</div>
                <div class="header-title">早安，天辰</div>
            </div>
            <div class="header-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
        </header>

        <main class="content">
            <!-- AI 推荐焦点卡 (极简边条) -->
            <div class="hero-card">
                <div class="hero-label">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                    智能聚焦
                </div>
                <div class="hero-title">完成产品 V2 迭代规划</div>
                <div class="hero-desc">已拆解为 4 个子任务，预计还需 2.5 小时。</div>
            </div>

            <!-- 无界列表组 -->
            <div>
                <div class="section-header">
                    <span class="section-title">In Progress</span>
                    <span style="font-size: 11px; color: var(--text-muted); font-weight: 500;">65%</span>
                </div>
                <div class="list-row" style="align-items: center;">
                    <!-- 极简进度环 -->
                    <div style="width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border-light); position: relative; flex-shrink: 0;">
                        <div style="position: absolute; top:-2px; left:-2px; right:-2px; bottom:-2px; border-radius:50%; border: 2px solid transparent; border-top-color: var(--primary-color); border-right-color: var(--primary-color); transform: rotate(45deg);"></div>
                    </div>
                    <div class="row-content">
                        <div class="row-title">掌握 HarmonyOS ArkUI 开发</div>
                    </div>
                    <div style="font-size: 11px; color: var(--text-muted);">12 待办</div>
                </div>
            </div>

            <!-- 今日待办 (彻底去色块化) -->
            <div>
                <div class="section-header">
                    <span class="section-title">Today</span>
                    <span style="font-size: 11px; color: var(--text-muted); font-weight: 500;">4 项</span>
                </div>
                <div class="list-group">
                    
                    <div class="list-row">
                        <div class="checkbox"></div>
                        <div class="row-content">
                            <div class="row-title">梳理轻科技感 UI 设计语言，完成组件样式的全局替换</div>
                            <div class="row-meta-area">
                                <div class="meta-item">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                                    <span>UI 优化</span>
                                </div>
                                <div class="meta-item">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                                    <span>45m</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="list-row">
                        <div class="checkbox" style="border-radius: 50%;"></div> <!-- 提醒可以是圆圈以示区分 -->
                        <div class="row-content">
                            <div class="row-title">准备团队周会汇报材料</div>
                            <div class="row-meta-area">
                                <div class="meta-item danger">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                                    <span>16:30 截止</span>
                                </div>
                                <div class="meta-item">
                                    <span>管理工作</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="list-row">
                        <div class="checkbox"></div>
                        <div class="row-content">
                            <div class="row-title">同步后端 API 接口文档</div>
                            <div class="row-meta-area">
                                <div class="meta-item"><span>研发</span></div>
                                <div class="meta-item">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                                    <span>14:00 - 15:00</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="list-row">
                        <div class="checkbox"></div>
                        <div class="row-content">
                            <div class="row-title">回复核心用户反馈邮件</div>
                            <div class="row-meta-area">
                                <div class="meta-item"><span>运营</span></div>
                                <div class="meta-item"><span>10m</span></div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </main>

        <!-- 极致悬浮 AI 按钮 -->
        <div class="ai-fab-container">
            <div class="ai-fab">
                <div class="ai-fab-dot"></div>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="22"></line>
                </svg>
            </div>
        </div>

        <!-- 极简导航 -->
        <nav class="tabbar">
            <div class="tab-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            </div>
            <div class="tab-item" style="margin-right: 30px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            </div>
            <div class="tab-item" style="margin-left: 30px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            </div>
            <div class="tab-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
        </nav>
    </div>
</body>
</html>
