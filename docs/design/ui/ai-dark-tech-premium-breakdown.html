<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronoisle - AI 目标规划页 (深色高密精工版)</title>
    <style>
        :root {
            --bg-color: #0D0E12; 
            --surface-color: #1A1B23;
            --surface-pressed: #22242E; 
            --text-primary: #F3F4F8;
            --text-secondary: #A0A4B8;
            --text-muted: #6B6F85;
            
            --primary-color: #7A7CFF; 
            --primary-light: rgba(122, 124, 255, 0.15);
            
            --ai-gradient: linear-gradient(135deg, #7A7CFF 0%, #00D4FF 100%);
            
            --border-light: rgba(255, 255, 255, 0.06);
            --border-highlight: rgba(255, 255, 255, 0.12);
            
            --shadow-card: 0 8px 16px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255,255,255,0.06);
            --shadow-btn: 0 4px 12px rgba(122, 124, 255, 0.3), inset 0 1px 1px rgba(255,255,255,0.2);
            
            --radius-lg: 14px;
            --radius-md: 10px;
            --radius-sm: 6px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #1C1D26; color: var(--text-primary);
            display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;
        }

        .device {
            width: 390px; height: 844px; background: var(--bg-color);
            background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 20px 20px; background-position: center top;
            border-radius: 40px; box-shadow: 0 24px 48px rgba(0,0,0,0.5);
            overflow: hidden; position: relative; display: flex; flex-direction: column;
            border: 8px solid #2A2B36;
        }

        /* 暗色毛玻璃标题栏 */
        .header {
            padding: 44px 16px 12px; display: flex; align-items: center; gap: 12px;
            background: linear-gradient(to bottom, rgba(13,14,18,0.95) 70%, rgba(13,14,18,0));
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            z-index: 10; position: absolute; top: 0; left: 0; right: 0;
        }
        .back-btn { width: 32px; height: 32px; display: flex; justify-content: center; align-items: center; background: var(--surface-color); border-radius: 16px; border: 1px solid var(--border-light); transition: 0.1s; box-shadow: var(--shadow-card); color: var(--text-secondary); }
        .back-btn:active { transform: scale(0.9); background: var(--surface-pressed); }
        .header-title { font-size: 16px; font-weight: 600; flex: 1; text-align: center; margin-right: 32px; letter-spacing: 0.5px; }

        .content { flex: 1; overflow-y: auto; padding: 100px 14px 80px; display: flex; flex-direction: column; gap: 16px; }
        .content::-webkit-scrollbar { display: none; }

        /* 顶部进度区 */
        .stage-card {
            background: linear-gradient(180deg, #1E1F29 0%, #15161D 100%);
            border-radius: var(--radius-lg); padding: 14px 16px;
            border: 1px solid var(--border-light); position: relative; overflow: hidden; box-shadow: var(--shadow-card);
        }
        .stage-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, #7A7CFF, #00D4FF, transparent); opacity: 0.6; }
        .stage-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
        .stage-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.4; }
        
        .progress-track { height: 4px; background: rgba(0,0,0,0.5); border-radius: 2px; margin-top: 12px; display: flex; gap: 4px; box-shadow: inset 0 1px 2px rgba(0,0,0,0.8); }
        .progress-step { flex: 1; height: 100%; border-radius: 2px; background: transparent; }
        .progress-step.active { background: var(--primary-color); box-shadow: 0 0 8px rgba(122,124,255,0.5); }

        /* AI 提问卡片 */
        .question-card { display: flex; flex-direction: column; gap: 8px; }
        .q-header { display: flex; gap: 8px; align-items: flex-end; }
        .ai-avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--ai-gradient); display: flex; justify-content: center; align-items: center; color: #fff; flex-shrink: 0; margin-bottom: 4px; box-shadow: 0 0 8px rgba(0,212,255,0.4); border: 1px solid rgba(255,255,255,0.2); }
        .ai-avatar svg { width: 12px; height: 12px; }
        
        /* 气泡对话框 (深色玻璃感) */
        .q-text { font-size: 14px; font-weight: 500; line-height: 1.4; background: rgba(26,27,35,0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 10px 14px; border-radius: 14px; border-bottom-left-radius: 2px; border: 1px solid var(--border-light); box-shadow: var(--shadow-card); }

        /* 用户选项 */
        .options-grid { display: flex; flex-direction: column; gap: 8px; margin-left: 32px; }
        .option-btn {
            background: linear-gradient(180deg, #1E1F29 0%, #15161D 100%);
            border: 1px solid var(--border-light); box-shadow: var(--shadow-card);
            padding: 10px 14px; border-radius: var(--radius-md); font-size: 13px; color: var(--text-secondary);
            text-align: left; transition: 0.1s;
        }
        .option-btn:active { transform: scale(0.98); background: var(--surface-pressed); }
        
        /* 选中态：极光边框 + 内发光 */
        .option-btn.selected { 
            background: var(--primary-light); 
            border-color: rgba(122,124,255,0.5); 
            color: var(--text-primary); font-weight: 600;
            box-shadow: 0 0 12px rgba(122,124,255,0.2), inset 0 1px 1px rgba(255,255,255,0.1);
        }

        /* 底部操作区 */
        .bottom-action {
            position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 20px 24px;
            background: linear-gradient(to top, rgba(13,14,18,1) 70%, rgba(13,14,18,0));
            display: flex; justify-content: center;
        }
        .primary-btn {
            width: 100%; max-width: 300px; 
            background: linear-gradient(135deg, #7A7CFF, #5B5CE6); color: #fff;
            padding: 14px; border-radius: 16px; font-size: 15px; font-weight: 600; text-align: center; letter-spacing: 0.5px;
            border: none; transition: 0.1s;
            box-shadow: var(--shadow-btn); border: 1px solid rgba(255,255,255,0.2);
        }
        .primary-btn:active { transform: scale(0.96); box-shadow: 0 2px 4px rgba(122, 124, 255, 0.2); }
    </style>
</head>
<body>
    <div class="device">
        <header class="header">
            <div class="back-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </div>
            <div class="header-title">AI 目标规划</div>
        </header>

        <main class="content">
            <div class="stage-card">
                <div class="stage-title">AI 正在追问细节</div>
                <div class="stage-desc">为了给你生成更合理的行动方案，AI 需要了解你的一些具体偏好。</div>
                <div class="progress-track">
                    <div class="progress-step active"></div>
                    <div class="progress-step active"></div>
                    <div class="progress-step"></div>
                </div>
            </div>

            <!-- 问答 1 -->
            <div class="question-card">
                <div class="q-header">
                    <div class="ai-avatar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path></svg>
                    </div>
                    <div class="q-text">你希望在这个目标上，每天投入多少时间？</div>
                </div>
                <div class="options-grid">
                    <button class="option-btn">15 - 30 分钟 (碎片时间)</button>
                    <button class="option-btn selected">1 小时左右 (稳定投入)</button>
                    <button class="option-btn">2 小时以上 (全力冲刺)</button>
                </div>
            </div>

            <!-- 问答 2 -->
            <div class="question-card">
                <div class="q-header">
                    <div class="ai-avatar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path></svg>
                    </div>
                    <div class="q-text">这个目标的理想截止时间是？</div>
                </div>
                <div class="options-grid">
                    <button class="option-btn">本周末之前</button>
                    <button class="option-btn">这个月底</button>
                    <button class="option-btn">先不设限，持续推进</button>
                </div>
            </div>
            
            <!-- 问答 3 -->
            <div class="question-card">
                <div class="q-header">
                    <div class="ai-avatar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path></svg>
                    </div>
                    <div class="q-text">遇到困难时，你更倾向于哪种 AI 辅助方式？</div>
                </div>
                <div class="options-grid">
                    <button class="option-btn">给我具体的步骤建议</button>
                    <button class="option-btn">帮我打气，提供情绪价值</button>
                </div>
            </div>
        </main>

        <div class="bottom-action">
            <button class="primary-btn">下一步：生成行动方案</button>
        </div>
    </div>
</body>
</html>
